name: portal_warga
description: "Portal Warga RT/RW - Aplikasi Layanan Warga"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  go_router: ^14.8.1
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  open_filex: ^4.6.1
  url_launcher: ^6.3.1
  photo_view: ^0.15.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app-icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app-icon-foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0D6EFD"
  image: "assets/splash/splash-icon.png"
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
  android_12:
    color: "#0D6EFD"
    image: "assets/splash/splash-icon.png"

flutter:
  uses-material-design: true
